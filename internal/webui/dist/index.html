<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Flameping</title><link rel="stylesheet" href="/app.css"></head>
<body><header><div><span class="mark">F</span><h1>Flameping</h1></div><span id="health" class="pill">connecting</span></header><main><aside><h2>Targets</h2><div id="targets" class="targets"></div></aside><section class="content"><div class="toolbar"><div><h2 id="title">Network overview</h2><p id="subtitle">Select a target to inspect latency and loss.</p></div><div id="ranges" class="ranges"></div></div><div class="stats" id="stats"></div><article class="panel"><div class="panel-title"><h3>Round-trip time</h3><span>drag a window to drill down · milliseconds</span></div><div id="latency" class="chart"></div></article><article class="panel"><div class="panel-title"><h3>Loss and local gaps</h3><span>percent</span></div><div id="loss" class="chart"></div></article><div class="lower"><article class="panel"><div class="panel-title"><h3>Interfaces</h3></div><div id="interfaces" class="table"></div><div class="panel-title sub"><h3 id="interface-title">Select an interface</h3></div><div id="interface-chart" class="chart small"></div></article><article class="panel"><div class="panel-title"><h3>Trace history</h3></div><div id="routes" class="table"></div><div id="trace-detail" class="table trace-detail"></div></article></div><p id="storage" class="storage"></p></section></main><script type="module" src="/app.js"></script></body></html>
