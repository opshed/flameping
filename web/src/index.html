<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Flameping</title><link rel="stylesheet" href="/app.css"></head>
<body><header><div><span class="mark">F</span><h1>Flameping</h1></div><span id="health" class="pill">connecting</span></header><main><aside><h2>Targets</h2><div id="targets" class="targets"></div></aside><section class="content"><div class="toolbar"><div><h2 id="title">Network overview</h2><p id="subtitle">Select a target to inspect latency and loss.</p></div><div id="ranges" class="ranges"></div></div><div class="stats" id="stats"></div><button id="interface-alert" class="interface-alert" aria-controls="interface-history">Interfaces · loading observations…</button><article class="panel flame-panel"><div class="panel-title"><h3>Latency distribution &amp; loss</h3><span>drag a window to drill down · RTT milliseconds · loss percent</span></div><p id="flame-status" class="route-note" role="status" hidden></p><div class="flame-key" aria-label="Chart layer key"><span><i class="key-grain"></i>RTT density</span><span><i class="key-deadline"></i>deadline lane</span><span><i class="key-noreply"></i>no-reply lane</span><span><i class="key-local">×</i>local gap</span><span><i class="key-partial"></i>partial bucket</span></div><div id="flame" class="chart flame-chart" role="group" aria-label="Latency distribution with mean and percentile contours, plus fixed deadline and no-reply loss lanes"></div></article><article class="panel interface-panel" id="interface-history" aria-label="Host interface activity over time"></article><article class="panel route-panel" id="route-history" aria-label="Route activity over time"></article><article class="panel interface-panel interface-details-panel" id="interface-details" aria-label="Interface diagnostic details" hidden></article><p id="storage" class="storage"></p></section></main><script type="module" src="/app.js"></script></body></html>
